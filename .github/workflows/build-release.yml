name: Build Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private source SHA, tag or branch; defaults to PRIVATE_SOURCE_REF'
        required: false
        type: string
      previous_source_ref:
        description: 'Previous private source SHA used to detect component version changes'
        required: false
        type: string
      tag:
        description: 'Release tag: vX.Y.Z or core-N; defaults to the changed component'
        required: false
        type: string
      publish_release:
        description: 'Publish a Release; automatic private pushes require a version change'
        required: true
        type: boolean
        default: true

concurrency:
  group: build-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    name: Check release metadata
    if: github.repository == 'Kindness-Kismet/storage-redirection-x'
    runs-on: ubuntu-26.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      app_version: ${{ steps.version.outputs.app_version }}
      app_version_code: ${{ steps.version.outputs.app_version_code }}
      core_version: ${{ steps.version.outputs.core_version }}
      tag: ${{ steps.release.outputs.tag }}
      publish_release: ${{ steps.release.outputs.publish_release }}
      changelog_base64: ${{ steps.changelog.outputs.changelog_base64 }}

    steps:
      - name: Check branch and private source access
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          SOURCE_REPOSITORY: ${{ vars.PRIVATE_SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.source_ref || vars.PRIVATE_SOURCE_REF }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo '::error::Run Build Release on main.'
            exit 1
          fi
          : "${SOURCE_TOKEN:?Configure the PRIVATE_SOURCE_TOKEN Secret}"
          : "${SOURCE_REPOSITORY:?Configure the PRIVATE_SOURCE_REPOSITORY Variable}"
          : "${SOURCE_REF:?Configure PRIVATE_SOURCE_REF or provide source_ref}"

      - name: Check out private source
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ vars.PRIVATE_SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || vars.PRIVATE_SOURCE_REF }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Pin private source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.x'

      - name: Read component versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/build_support/versions.py >> "${GITHUB_OUTPUT}" 2> "${RUNNER_TEMP}/private-version.log"; then
            echo '::error::Cannot read private component versions. Review the source configuration privately.'
            exit 1
          fi

      - name: Select release tag and publication mode
        id: release
        shell: python
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PREVIOUS_SOURCE_REF: ${{ inputs.previous_source_ref }}
          REQUEST_PUBLISH: ${{ inputs.publish_release }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.app_version_code }}
          CORE_VERSION: ${{ steps.version.outputs.core_version }}
        run: |
          import os
          import re
          import subprocess
          import tomllib

          app_tag = f"v{os.environ['APP_VERSION']}"
          core_tag = f"core-{os.environ['CORE_VERSION']}"
          tag = os.environ['INPUT_TAG']
          should_publish = os.environ['REQUEST_PUBLISH'] == 'true'

          previous = os.environ['PREVIOUS_SOURCE_REF']
          if previous and previous != '0' * 40:
              if re.fullmatch(r'[0-9a-f]{40}', previous) is None:
                  raise SystemExit('previous_source_ref must be a full commit SHA')
              properties = subprocess.check_output(
                  ['git', 'show', f'{previous}:android/gradle.properties'], text=True)
              previous_app = dict(line.strip().split('=', 1) for line in properties.splitlines() if '=' in line)
              manifest = subprocess.check_output(
                  ['git', 'show', f'{previous}:srx_core/Cargo.toml'], text=True)
              previous_core = tomllib.loads(manifest)['package']['version']
              app_changed = (previous_app['appVersionName'] != os.environ['APP_VERSION'] or
                             previous_app['appVersionCode'] != os.environ['APP_VERSION_CODE'])
              core_changed = previous_core != f"{os.environ['CORE_VERSION']}.0.0"
              if not tag:
                  tag = app_tag if app_changed or not core_changed else core_tag
                  should_publish = should_publish and (app_changed or core_changed)
          tag = tag or app_tag
          if tag not in (app_tag, core_tag):
              raise SystemExit(f'Release tag must match {app_tag} or {core_tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag={tag}\npublish_release={str(should_publish).lower()}\n')

      - name: Read release notes and write summary
        id: changelog
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          CORE_VERSION: ${{ steps.version.outputs.core_version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PUBLISH_RELEASE: ${{ steps.release.outputs.publish_release }}
        run: |
          set -euo pipefail
          test -s .github/CHANGELOG.md
          printf 'changelog_base64=%s\n' "$(base64 -w 0 .github/CHANGELOG.md)" >> "${GITHUB_OUTPUT}"
          {
            printf '# Storage Redirect X\n\n'
            printf 'APK: %s\n\nCore: %s\n\nTag: %s\n\n' "${APP_VERSION}" "${CORE_VERSION}" "${RELEASE_TAG}"
            printf 'Source commit: `%s`\n\nPublish release: %s\n\n' "${SOURCE_SHA}" "${PUBLISH_RELEASE}"
            cat .github/CHANGELOG.md
          } >> "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build Android (${{ matrix.abi }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            abi: arm64-v8a
          - runner: ubuntu-26.04
            abi: x86_64
    env:
      BUILD_ABI: ${{ matrix.abi }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      APP_VERSION_CODE: ${{ needs.prepare.outputs.app_version_code }}
      CORE_VERSION: ${{ needs.prepare.outputs.core_version }}

    steps:
      - name: Check out pinned private source
        uses: actions/checkout@v7.0.0
        with:
          repository: ${{ vars.PRIVATE_SOURCE_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          show-progress: false

      - name: Set up Java
        uses: actions/setup-java@v5.4.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools

      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install Android platform, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          (yes | sdkmanager --licenses > /dev/null) || true
          ndk_version="30.0.16248370"
          latest_cmake_pkg=$(sdkmanager --list | tr -d '\r' | grep -oE 'cmake;[0-9][0-9.]+' | sort -Vu | tail -n 1)
          sdkmanager "platforms;android-37.2" "build-tools;36.0.0" "ndk;${ndk_version}" "${latest_cmake_pkg}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ndk_version}" >> "${GITHUB_ENV}"
          cmake_version="${latest_cmake_pkg#cmake;}"
          echo "${ANDROID_SDK_ROOT}/cmake/${cmake_version}/bin" >> "${GITHUB_PATH}"

      - name: Prepare pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/prebuild.py > "${RUNNER_TEMP}/private-prebuild.log" 2>&1; then
            echo '::error::Native source preparation failed. Detailed logs remain private.'
            exit 1
          fi

      - name: Check prepared native sources
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/prebuild.py --check > "${RUNNER_TEMP}/private-prebuild-check.log" 2>&1; then
            echo '::error::Native source validation failed. Detailed logs remain private.'
            exit 1
          fi

      - name: Prepare release signing
        if: startsWith(needs.prepare.outputs.tag, 'v')
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing Secret: ${key}"
              exit 1
            fi
          done
          keystore_path="${RUNNER_TEMP}/release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          keytool -list -keystore "${keystore_path}" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "${ANDROID_KEY_ALIAS}" > /dev/null
          echo "keystore_path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Build release Zygisk module
        shell: bash
        run: |
          set -euo pipefail
          if ! python scripts/build.py build-zygisk --abi "${BUILD_ABI}" > "${RUNNER_TEMP}/private-module-build.log" 2>&1; then
            echo '::error::Module compilation failed. Detailed logs remain private.'
            exit 1
          fi

      - name: Build signed release APK
        if: startsWith(needs.prepare.outputs.tag, 'v')
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! python scripts/build.py build-apk --abi "${BUILD_ABI}" > "${RUNNER_TEMP}/private-apk-build.log" 2>&1; then
            echo '::error::APK compilation failed. Detailed logs remain private.'
            exit 1
          fi

      - name: Validate release packages
        shell: python
        run: |
          import os
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          abi = os.environ['BUILD_ABI']
          app_version = os.environ['APP_VERSION']
          core_version = os.environ['CORE_VERSION']
          module = Path(f'build/zygisk/Storage-Redirect-X_v{core_version}-{abi}.zip')
          with zipfile.ZipFile(module) as archive:
              properties = dict(line.split('=', 1) for line in archive.read('module.prop').decode().splitlines() if '=' in line)
              if properties['version'] != core_version or properties['versionCode'] != core_version:
                  raise SystemExit('Module version does not match the release metadata')
              library = archive.read(f'zygisk/{abi}.so')
              machine = int.from_bytes(library[18:20], 'little')
              if library[:4] != b'\x7fELF' or machine != {'arm64-v8a': 183, 'x86_64': 62}[abi]:
                  raise SystemExit('Module ELF architecture does not match the target ABI')
          packages = [module]
          if os.environ['RELEASE_TAG'].startswith('v'):
              apk = Path(f'build/apk/Storage-Redirect-X_{app_version}_{abi}.apk')
              tools = Path(os.environ['ANDROID_SDK_ROOT']) / 'build-tools/36.0.0'
              subprocess.run([str(tools / 'apksigner'), 'verify', str(apk)], check=True)
              badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
              version = re.search(r"versionCode='([^']+)' versionName='([^']+)'", badging)
              if version is None or version.groups() != (os.environ['APP_VERSION_CODE'], app_version):
                  raise SystemExit('APK version does not match the release metadata')
              native_abis = re.search(r"^native-code: (.+)$", badging, re.MULTILINE)
              if native_abis is None or re.findall(r"'([^']+)'", native_abis[1]) != [abi]:
                  raise SystemExit('APK native libraries do not match the target ABI')
              packages.append(apk)
          destination = Path('build/ci/packages') / abi
          destination.mkdir(parents=True, exist_ok=True)
          for package in packages:
              if package.stat().st_size == 0:
                  raise SystemExit(f'Empty release package: {package.name}')
              shutil.copy2(package, destination / package.name)
              print(f'Validated package: {package.name}')

      - name: Upload release packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages-${{ matrix.abi }}
          path: build/ci/packages/${{ matrix.abi }}/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    if: needs.prepare.outputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: packages-*
          path: build/ci/artifacts/
          merge-multiple: true

      - name: Check complete release package set
        shell: python
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          CORE_VERSION: ${{ needs.prepare.outputs.core_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          import os
          from pathlib import Path

          expected = set()
          for abi in ('arm64-v8a', 'x86_64'):
              expected.add(f"Storage-Redirect-X_v{os.environ['CORE_VERSION']}-{abi}.zip")
              if os.environ['RELEASE_TAG'].startswith('v'):
                  expected.add(f"Storage-Redirect-X_{os.environ['APP_VERSION']}_{abi}.apk")
          packages = list(Path('build/ci/artifacts').iterdir())
          if {path.name for path in packages} != expected:
              raise SystemExit('Release packages do not match the complete target matrix')
          if any(not path.is_file() or path.stat().st_size == 0 for path in packages):
              raise SystemExit('Release packages must be non-empty files')
          print(f'Validated {len(packages)} release packages')

      - name: Create tag and publish verified packages
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          CHANGELOG_BASE64: ${{ needs.prepare.outputs.changelog_base64 }}
        run: |
          import base64
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def gh(*args):
              result = subprocess.run(['gh', *args], check=True, capture_output=True, text=True)
              return result.stdout

          tag = os.environ['RELEASE_TAG']
          public_sha = os.environ['GITHUB_SHA']
          repository = os.environ['GH_REPO']
          refs = json.loads(gh('api', f'repos/{repository}/git/matching-refs/tags/{tag}'))
          ref = next((item for item in refs if item['ref'] == f'refs/tags/{tag}'), None)
          if ref is not None:
              target = ref['object']
              while target['type'] == 'tag':
                  target = json.loads(gh('api', f"repos/{repository}/git/tags/{target['sha']}"))['object']
              if target['sha'] != public_sha:
                  raise SystemExit('Existing release tag points to a different public workflow commit')
          else:
              gh('api', '--method', 'POST', f'repos/{repository}/git/refs',
                 '-f', f'ref=refs/tags/{tag}', '-f', f'sha={public_sha}')
          releases = json.loads(gh('api', '--paginate', '--slurp', f'repos/{repository}/releases?per_page=100'))
          release = next((item for page in releases for item in page if item['tag_name'] == tag), None)
          if release is not None and not release['draft']:
              raise SystemExit('Release is already public; existing packages will not be overwritten')
          notes = Path(os.environ['RUNNER_TEMP']) / 'release-notes.md'
          notes.write_bytes(base64.b64decode(os.environ['CHANGELOG_BASE64'], validate=True))
          if not notes.read_text(encoding='utf-8').strip():
              raise SystemExit('Release notes must not be empty')
          title = f'Storage Redirect X {tag}'
          is_prerelease = re.fullmatch(r'v\d+\.\d+\.\d+-beta\d+', tag) is not None
          flags = ['--title', title, '--notes-file', str(notes), f'--prerelease={str(is_prerelease).lower()}']
          if release is None:
              gh('release', 'create', tag, '--verify-tag', '--draft', *flags)
          else:
              gh('release', 'edit', tag, *flags)
          packages = sorted(Path('build/ci/artifacts').iterdir())
          gh('release', 'upload', tag, *(str(path) for path in packages), '--clobber')
          uploaded = json.loads(gh('release', 'view', tag, '--json', 'assets'))['assets']
          expected = {path.name: path.stat().st_size for path in packages}
          if {item['name']: item['size'] for item in uploaded} != expected:
              raise SystemExit('Uploaded release assets do not match the validated package set')
          make_latest = tag.startswith('v') and not is_prerelease
          gh('release', 'edit', tag, '--draft=false', f'--latest={str(make_latest).lower()}')
          print(gh('release', 'view', tag, '--json', 'url', '--jq', '.url').strip())
